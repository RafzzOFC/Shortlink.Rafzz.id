<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raf Official</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#f5f5f5;color:#222}
.container{width:90%;max-width:430px;background:#fff;padding:30px;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.08);text-align:center}
h1{margin-top:0;font-size:27px}.subtitle{color:#777;margin-bottom:25px}
input{width:100%;padding:14px;margin-bottom:12px;border:1px solid #ddd;border-radius:10px;outline:none;font-size:15px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#222;color:#fff;font-size:15px;cursor:pointer;margin-top:8px}
button:hover{opacity:.85}.timer{font-size:55px;font-weight:bold;margin:25px 0 10px}.status{color:#777}
.hidden{display:none!important}.copy-box{margin-top:20px;padding:12px;background:#f1f1f1;border-radius:10px;word-break:break-all;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.popup{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:popup .25s ease}
@keyframes popup{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.popup-icon{font-size:50px;margin-bottom:10px}.popup h2{margin:5px 0 10px}.popup p{color:#666;line-height:1.5;font-size:14px}
.join-btn{background:#168c45}.skip-btn{background:#e9e9e9;color:#333}.small{margin-top:12px;font-size:12px;color:#999}
</style>
</head>
<body>
<div class="container">
  <div id="generator">
    <h1>Raf Official</h1>
    <p class="subtitle">Buat link dengan cooldown 5 detik</p>
    <input type="text" id="linkName" placeholder="Nama link, contoh: Download APK">
    <input type="url" id="targetLink" placeholder="https://contoh.com/file">
    <button onclick="createLink()">Buat Link</button>
    <div id="result"></div>
  </div>

  <div id="cooldown" class="hidden">
    <h1>Raf Official</h1>
    <p id="welcomeText">Menyiapkan link...</p>
    <div class="timer" id="timer">5</div>
    <p class="status" id="status">Harap tunggu...</p>
  </div>
</div>

<div id="adPopup" class="overlay hidden">
  <div class="popup">
    <div class="popup-icon">📢</div>
    <h2>Raf Official</h2>
    <p>
      Join saluran <b>Raf Official</b> untuk mendapatkan
      update APK, aplikasi, dan berbagai konten lainnya
      secara gratis.
    </p>
    <button class="join-btn" onclick="joinChannel()">📲 Join Saluran Raf Official</button>
    <button class="skip-btn" onclick="skipAd()">Lewati Iklan</button>
    <div class="small">Kamu dapat melewati iklan kapan saja.</div>
  </div>
</div>

<script>
const channelLink="https://whatsapp.com/channel/0029Vb75VQWA2pL9MTcaeQ31";

function createLink(){
  const name=document.getElementById("linkName").value.trim();
  const target=document.getElementById("targetLink").value.trim();
  const result=document.getElementById("result");

  if(!name||!target){alert("Nama dan link harus diisi.");return}

  try{new URL(target)}
  catch{alert("Link tidak valid. Contoh: https://google.com");return}

  const generated=window.location.origin+window.location.pathname+
    "?name="+encodeURIComponent(name)+"&url="+encodeURIComponent(target);

  result.innerHTML=`
    <div class="copy-box">
      <strong>Link berhasil dibuat:</strong><br><br>${generated}
    </div>
    <button onclick="copyLink()">Salin Link</button>`;
  window.generatedLink=generated;
}

function copyLink(){
  navigator.clipboard.writeText(window.generatedLink)
    .then(()=>alert("Link berhasil disalin!"))
    .catch(()=>alert("Gagal menyalin link."));
}

const params=new URLSearchParams(window.location.search);
const name=params.get("name");
const target=params.get("url");

if(name&&target){
  document.getElementById("generator").classList.add("hidden");
  document.getElementById("adPopup").classList.remove("hidden");
}

function joinChannel(){
  window.open(channelLink,"_blank");
}

function skipAd(){
  document.getElementById("adPopup").classList.add("hidden");
  startCooldown();
}

function startCooldown(){
  document.getElementById("cooldown").classList.remove("hidden");
  document.getElementById("welcomeText").textContent=
    'Link "'+name+'" sedang disiapkan...';

  let time=5;
  const timer=document.getElementById("timer");
  const status=document.getElementById("status");
  timer.textContent=time;
  status.textContent="Harap tunggu...";

  const countdown=setInterval(()=>{
    time--;
    timer.textContent=time;
    if(time<=0){
      clearInterval(countdown);
      timer.textContent="✓";
      status.textContent="Mengalihkan ke link...";
      setTimeout(()=>{window.location.href=target},500);
    }
  },1000);
}
</script>
</body>
</html>
