<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rafzz Shortlink V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f5f5;color:#111}
body:before{content:"ラフズ • RAFZZ • リンク • OFFICIAL";position:fixed;inset:0;display:grid;place-items:center;font-size:clamp(35px,9vw,100px);font-weight:900;letter-spacing:8px;color:#00000006;transform:rotate(-18deg);pointer-events:none}
nav{height:68px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:relative;z-index:2}
.brand{font-weight:900;letter-spacing:.5px}.brand span{font-size:11px;color:#aaa;display:block;font-weight:500}
.navbtn{border:1px solid #555;background:#222;color:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}
.wrap{width:min(940px,92%);margin:35px auto;position:relative;z-index:1}
.hero{text-align:center;margin-bottom:25px}.hero h1{font-size:clamp(30px,6vw,52px);margin:0}.hero p{color:#777;margin:9px 0}
.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{flex:1;padding:13px;border:0;border-radius:12px;background:#e7e7e7;font-weight:800;cursor:pointer}.tab.active{background:#111;color:#fff}
.panel{background:#fff;border:1px solid #e4e4e4;border-radius:22px;padding:24px;box-shadow:0 18px 45px #0000000d}
label{display:block;font-size:13px;font-weight:800;margin:15px 0 7px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:15px;outline:none}input:focus{border-color:#111}
button.primary{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:#111;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.result{display:none;margin-top:18px;padding:16px;border-radius:15px;background:#f4f4f4}.result.show{display:block}.linkbox{word-break:break-all;font-size:13px;margin:8px 0 12px}
.copy{border:0;background:#ddd;padding:9px 12px;border-radius:9px;font-weight:700;cursor:pointer}
.hidden{display:none}.count{width:100px;height:100px;border:7px solid #111;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;margin:15px auto}
.center{text-align:center}.small{font-size:12px;color:#888;line-height:1.5}
.saved{margin-top:20px}.item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.item b{font-size:14px}.item small{display:block;color:#888;margin-top:4px;word-break:break-all}
.danger{border:0;background:#eee;border-radius:8px;padding:8px;cursor:pointer}
@media(max-width:600px){nav{padding:0 4%}.panel{padding:18px}.item{align-items:flex-start;flex-direction:column}.danger{align-self:flex-end}}
</style>
</head>
<body>
<nav><div class="brand">Rafzz Official<span>SHORTLINK V2 • ラフズ</span></div><button class="navbtn" onclick="showCreate()">Buat Link</button></nav>

<div class="wrap">
<section class="hero">
<h1>Rafzz Shortlink</h1><p>Buat halaman redirect sederhana tanpa database.</p>
</section>

<div id="create">
<div class="tabs"><button class="tab active">Buat Link</button></div>
<div class="panel">
<label>Nama Link</label>
<input id="name" placeholder="Contoh: Download Anime X">
<label>URL Tujuan</label>
<input id="target" type="url" placeholder="https://contoh.com/file">
<button class="primary" onclick="makeLink()">Buat Link Sekarang</button>
<div id="result" class="result">
<strong>Link berhasil dibuat</strong>
<div id="generated" class="linkbox"></div>
<button class="copy" onclick="copyLink()">Salin Link</button>
</div>
<div class="saved" id="saved"></div>
</div>
</div>

<div id="redirect" class="panel hidden center">
<div class="small">RAFZZ OFFICIAL • REDIRECT</div>
<h2 id="rTitle">Menyiapkan link...</h2>
<div class="count" id="count">5</div>
<p id="rStatus">Mohon tunggu sebentar.</p>
<a id="go" class="primary" style="display:block;text-decoration:none;opacity:.45;pointer-events:none">Lanjutkan</a>
<p class="small">Redirect ini hanya bekerja untuk URL yang dibuat melalui halaman ini.</p>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let generatedUrl="";
function showCreate(){$("create").classList.remove("hidden");$("redirect").classList.add("hidden")}
function makeLink(){
 const name=$("name").value.trim()||"Rafzz Link";
 const target=$("target").value.trim();
 if(!/^https?:\/\/\S+/i.test(target)){alert("Masukkan URL lengkap yang diawali http:// atau https://");return}
 const data=btoa(unescape(encodeURIComponent(JSON.stringify({n:name,u:target}))));
 generatedUrl=location.href.split("#")[0]+"#go="+data;
 $("generated").textContent=generatedUrl;
 $("result").classList.add("show");
 localStorage.setItem("rafzz_links",JSON.stringify([{n:name,u:target,url:generatedUrl},...JSON.parse(localStorage.getItem("rafzz_links")||"[]").slice(0,9)]));
 renderSaved();
}
function copyLink(){navigator.clipboard?.writeText(generatedUrl).then(()=>alert("Link disalin!")).catch(()=>prompt("Salin link ini:",generatedUrl))}
function renderSaved(){
 const list=JSON.parse(localStorage.getItem("rafzz_links")||"[]");
 $("saved").innerHTML=list.length?'<h3>Link Terakhir</h3>'+list.map((x,i)=>`<div class="item"><div><b>${escapeHtml(x.n)}</b><small>${escapeHtml(x.u)}</small></div><button class="danger" onclick="removeLink(${i})">Hapus</button></div>`).join(""):"";
}
function removeLink(i){let a=JSON.parse(localStorage.getItem("rafzz_links")||"[]");a.splice(i,1);localStorage.setItem("rafzz_links",JSON.stringify(a));renderSaved()}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openRedirect(){
 const raw=location.hash.startsWith("#go=")?location.hash.slice(4):"";
 if(!raw)return;
 try{
  const d=JSON.parse(decodeURIComponent(escape(atob(raw))));
  if(!/^https?:\/\/\S+/i.test(d.u))throw 0;
  $("create").classList.add("hidden");$("redirect").classList.remove("hidden");$("rTitle").textContent=d.n;
  let s=5;$("count").textContent=s;
  const t=setInterval(()=>{s--; $("count").textContent=s;if(s<=0){clearInterval(t);$("rStatus").textContent="Link siap digunakan.";const g=$("go");g.href=d.u;g.style.opacity="1";g.style.pointerEvents="auto";}},1000);
 }catch(e){showCreate()}
}
renderSaved();openRedirect();
</script>
</body>
</html>
